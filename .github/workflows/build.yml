name: Build

# Manual only: Actions tab -> Build -> Run workflow.
# Type the Lel Edition number (for example 1.6) to name the files and publish a
# release like the earlier ones: tag 6.6.3-v1.6, "Rdio-Scanner Lel Edition v1.6".
# Leave it empty to only get test builds under Artifacts (kept 14 days).
on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Lel Edition number, e.g. 1.6 (empty = test build, no release)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build the web app
        working-directory: client
        run: |
          npm ci --loglevel=error --no-progress
          npm run build
      - uses: actions/setup-go@v5
        with:
          go-version: "1.19"
          cache-dependency-path: server/go.sum
      - name: Check the server compiles and the dirwatch parser tests pass
        working-directory: server
        run: |
          go vet ./...
          go test -run 'DSDFMENeo' ./...
      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: server/webapp
          retention-days: 1

  server:
    needs: webapp
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, label: windows-amd64, bin: rdio-scanner.exe }
          - { goos: linux,   goarch: amd64, label: linux-amd64,   bin: rdio-scanner }
          - { goos: linux,   goarch: arm64, label: linux-arm64,   bin: rdio-scanner }
          - { goos: linux,   goarch: arm,   label: linux-arm,     bin: rdio-scanner }
          - { goos: darwin,  goarch: amd64, label: macos-amd64,   bin: rdio-scanner }
          - { goos: darwin,  goarch: arm64, label: macos-arm64,   bin: rdio-scanner }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: server/webapp
      - uses: actions/setup-go@v5
        with:
          go-version: "1.19"
          cache-dependency-path: server/go.sum
      - name: Build
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p ../out/pkg
          go build -trimpath -ldflags "-s -w" -o ../out/pkg/${{ matrix.bin }}
      - name: Zip
        run: |
          E="${{ inputs.edition }}"; E="${E:-test}"
          N="rdio-scanner_lel_v${E}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp out/pkg/${{ matrix.bin }} out/${N}.exe
          else
            cp LICENSE out/pkg/ || true
            (cd out/pkg && zip -q ../${N}_${{ matrix.label }}.zip *)
          fi
          rm -rf out/pkg
      - uses: actions/upload-artifact@v4
        with:
          name: rdio-scanner-${{ matrix.label }}
          path: out/*
          retention-days: 14

  release:
    needs: server
    if: ${{ inputs.edition != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: server/version.go
      - uses: actions/download-artifact@v4
        with:
          pattern: rdio-scanner-*
          path: dist
          merge-multiple: true
      - name: Work out the tag
        id: tag
        run: |
          V=$(grep -oP 'Version\s*=\s*"\K[^"]+' server/version.go)
          echo "tag=${V}-v${{ inputs.edition }}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Rdio-Scanner Lel Edition v${{ inputs.edition }}
          target_commitish: ${{ github.sha }}
          files: dist/*
